<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; navigate-to https://nav.xianran.de">
  <title>闲然导航 · 无法连接</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px; color: #f8edcf; background: radial-gradient(circle at 50% 0, #173d69 0, #081b39 45%, #040d20 100%); }
    main { width: min(520px, 100%); padding: 36px; text-align: center; border: 1px solid rgba(225, 184, 105, .55); border-radius: 24px; background: rgba(7, 22, 48, .82); box-shadow: 0 28px 80px rgba(0, 0, 0, .36); }
    img { width: 92px; height: 92px; border-radius: 22px; box-shadow: 0 12px 32px rgba(64, 176, 255, .28); }
    h1 { margin: 22px 0 10px; font-size: 25px; }
    p { margin: 0 auto 24px; max-width: 390px; color: #c3d3e7; line-height: 1.75; }
    a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 0 24px; color: #06142d; font-weight: 700; text-decoration: none; border-radius: 999px; background: linear-gradient(135deg, #f2d18f, #c99a55); box-shadow: 0 8px 24px rgba(216, 173, 104, .25); }
    a:focus-visible { outline: 3px solid #70cbff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="../assets/icons/astral-app-icon.png" alt="闲然导航图标">
    <h1>暂时无法连接服务器</h1>
    <p>桌面应用需要连接 nav.xianran.de 才能读取和保存你的数据。请检查网络或服务器状态，然后重新连接。</p>
    <a href="https://nav.xianran.de/">重新连接</a>
  </main>
</body>
</html>
